# Builds the self-hosted map tiles for the descent (issue #4, PRD v1.1): three PMTiles
# extracts of the Protomaps OpenStreetMap basemap, so the site makes no third-party map
# requests at runtime (PRD §10.4). Map data © OpenStreetMap contributors (ODbL).
#
# Run it again from the Actions tab (workflow_dispatch) to refresh the data.
name: Build map tiles

on:
  push:
    branches: [main]
    paths: [.github/workflows/build-map-tiles.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the pmtiles CLI
        run: |
          gh release download -R protomaps/go-pmtiles --pattern '*Linux_x86_64.tar.gz' -O pmtiles.tgz
          tar -xzf pmtiles.tgz pmtiles
          ./pmtiles version
      - name: Find the Protomaps build
        run: |
          # Stay on the build the committed tiles came from, so the three extracts match; else the latest.
          PINNED=$(jq -r '.build // empty' public/assets/map/manifest.json 2>/dev/null || true)
          if [ -n "$PINNED" ] && curl -fsI "https://build.protomaps.com/$PINNED" >/dev/null; then KEY=$PINNED
          else KEY=$(curl -fsSL https://build-metadata.protomaps.dev/builds.json | jq -r '[.[].key] | sort | last'); fi
          echo "SOURCE=https://build.protomaps.com/$KEY" >> "$GITHUB_ENV"
          echo "BUILD=$KEY" >> "$GITHUB_ENV"
          echo "Using $KEY"
      - name: Extract
        run: |
          mkdir -p public/assets/map
          # World and region change rarely; delete a file to rebuild it.
          # The whole world at low zoom: what the globe hands off to.
          [ -f public/assets/map/world.pmtiles ] || ./pmtiles extract "$SOURCE" public/assets/map/world.pmtiles --maxzoom=5
          # The New York metro region: the highlighted area.
          [ -f public/assets/map/region.pmtiles ] || ./pmtiles extract "$SOURCE" public/assets/map/region.pmtiles --bbox=-74.55,40.35,-73.45,41.05 --minzoom=6 --maxzoom=12
          # The street-level patch for the 3D dive: Hoboken, with Midtown and Chelsea across the river
          # in view. Must contain owner.area.street in site-content.json.
          rm -f public/assets/map/city.pmtiles
          ./pmtiles extract "$SOURCE" public/assets/map/city.pmtiles --bbox=-74.050,40.728,-73.975,40.775 --minzoom=13 --maxzoom=15
          ls -la public/assets/map
          for f in public/assets/map/*.pmtiles; do ./pmtiles show "$f" | head -20; done
          printf '{\n  "build": "%s",\n  "source": "Protomaps basemap (OpenStreetMap)",\n  "attribution": "© OpenStreetMap contributors"\n}\n' "$BUILD" > public/assets/map/manifest.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/map
          git diff --cached --quiet || git commit -m "Map tiles: Protomaps OpenStreetMap extracts (${BUILD})"
          git push
