# One-off: fetches the public-domain scan of Leonardo's Vitruvian Man (Wikimedia Commons,
# photographed by Luc Viatour; PD-Art) into assets-src/ for `npm run vitruvian:trace`.
# Safe to delete once assets-src/vitruvian-source.jpg is committed.
name: Fetch Vitruvian source scan

on:
  push:
    branches: [main]
    paths: [.github/workflows/fetch-vitruvian.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download the scan
        run: |
          mkdir -p assets-src
          curl -fsSL -A "microcosm-personal-site/1.0 (https://github.com/srir4m/personal-website)" \
            -o assets-src/vitruvian-source.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Da_Vinci_Vitruve_Luc_Viatour.jpg"
          file assets-src/vitruvian-source.jpg | grep -q "JPEG image data"
          ls -l assets-src/vitruvian-source.jpg
      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets-src/vitruvian-source.jpg
          git diff --cached --quiet || git commit -m "Add Vitruvian Man source scan (Wikimedia Commons, public domain)"
          git push
